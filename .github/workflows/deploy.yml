name: "DABs CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  # ----------------------------------------------------------------
  # Step 1: Validate the bundle on every push and PR
  # ----------------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: self-hosted    # Uses runner in your Azure VNet (IP-allowlisted)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (dev)
        run: databricks bundle validate --strict -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  # ----------------------------------------------------------------
  # Step 2: Deploy to Dev — auto-triggers on push to main
  # ----------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted    # Uses runner in your Azure VNet (IP-allowlisted)
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run job in dev
        run: databricks bundle run dabs_cicd_demo_job -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  # ----------------------------------------------------------------
  # Step 3: Deploy to Prod — manual trigger with approval gate
  # ----------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: self-hosted    # Uses runner in your Azure VNet (IP-allowlisted)
    environment: prod   # Configure required reviewers in GitHub repo settings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to prod
        run: databricks bundle deploy -t prod
        env:
          # Use separate secrets per environment for isolation
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
